name: Jekyll build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Minor only: newer runner images keep just the latest patch
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build
